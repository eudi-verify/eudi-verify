packages:
  - "packages/*"
  - "examples/*"

overrides:
  # HAIP spike against the x509_hash fork, ahead of an upstream release.
  # https://github.com/mkascel/openid4vp/pull/new/feat/x509-hash-client-id-prefix
  "@openeudi/openid4vp": "github:mkascel/openid4vp#feat/x509-hash-client-id-prefix"
  esbuild: ">=0.28.1"
  vite: ">=6.4.3"
  # ^3.15.0 — not >=3.15.0. Bare >= pulls js-yaml 4.x, which drops safeLoad and breaks
  # @changesets/cli → @manypkg/get-packages → read-yaml-file@1.1.0.
  "js-yaml@3": "^3.15.0"
  # vue-tsc/spectral-cli pull minimatch@9/@3, which pin brace-expansion@1/@2
  # (DoS via unbounded expansion). Fix only ships in the 5.x rewrite; 5.0.9
  # covers a follow-up bypass of the original 5.0.8 mitigation.
  brace-expansion: ">=5.0.9"
  # vite/tsup → postcss-load-config pins postcss <8.5.18 (path traversal via sourceMappingURL).
  postcss: ">=8.5.18"
  # spectral-cli → ajv pins fast-uri <3.1.5 (host confusion via backslash authority introducer).
  fast-uri: ">=3.1.5"

allowBuilds:
  # Optional native accel for cbor-x (via @openeudi/openid4vp). Pure-JS
  # fallback is fine for our verify path — do not approve the build.
  "@scarf/scarf": false
  cbor-extract: false
  esbuild: true
  # HAIP spike git dependency (see overrides above): needs its own `prepare`
  # (tsup) to build dist/ on install, since git deps skip the npm registry's
  # prepublish build step. Key is pinned to the exact commit pnpm resolved —
  # bump it if the override's branch ref moves.
  "@openeudi/openid4vp@https://codeload.github.com/mkascel/openid4vp/tar.gz/1545f7a029596f4f4a00cf454f7cc0b7ae866379": true

onlyBuiltDependencies:
  - esbuild
