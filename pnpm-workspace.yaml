packages:
  - "packages/*"
  - "examples/*"

overrides:
  esbuild: ">=0.28.1"
  vite: ">=6.4.3"
  # ^3.15.1 — not >=3.15.0 or bare >=. Bare >= pulls js-yaml 4.x, which drops
  # safeLoad and breaks @changesets/cli → @manypkg/get-packages →
  # read-yaml-file@1.1.0. 3.15.1 fixes CVE-2026-59870 (quadratic CPU via
  # !!omap resolution) in the 3.x line.
  "js-yaml@3": "^3.15.1"
  # @changesets/parse pulls js-yaml 4.x directly; separate line from the 3.x
  # pin above since both majors coexist. 4.3.1 fixes the same CVE in 4.x.
  "js-yaml@4": "^4.3.1"
  # vitest → @vitest/mocker/vite/vite-node → postcss → nanoid: indefinite
  # loop with a zero-size custom generator, fixed 3.3.17.
  nanoid: ">=3.3.17"
  # vue-tsc/spectral-cli pull minimatch@9/@3, which pin brace-expansion@1/@2
  # (DoS via unbounded expansion). Fix only ships in the 5.x rewrite; 5.0.9
  # covers a follow-up bypass of the original 5.0.8 mitigation.
  brace-expansion: ">=5.0.9"
  # vite/tsup → postcss-load-config pins postcss <8.5.23 (sourceMappingURL
  # reads arbitrary .map files when `from` is unset; 8.5.18 fixed an earlier,
  # incomplete version of this same issue).
  postcss: ">=8.5.23"
  # spectral-cli → ajv pins fast-uri <3.1.5 (host confusion via backslash authority introducer).
  fast-uri: ">=3.1.5"

allowBuilds:
  # Optional native accel for cbor-x (via @openeudi/openid4vp). Pure-JS
  # fallback is fine for our verify path — do not approve the build.
  "@scarf/scarf": false
  cbor-extract: false
  esbuild: true

onlyBuiltDependencies:
  - esbuild

# 0.10.0 lands the x509_hash support we ran the OIDF certification against
# (openeudi/openid4vp#33, reviewed and merged upstream), so the release-age
# cooldown adds nothing here: we tracked this change through review ourselves.
minimumReleaseAgeExclude:
  - "@openeudi/openid4vp@0.10.0"
